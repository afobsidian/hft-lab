name: Clang scaffold
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        preset: [debug, sanitize, release]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev cmake ninja-build
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      # Exercise checks intentionally fail until you implement PriceLevel.
      - run: ctest --preset ${{ matrix.preset }} -L scaffold
