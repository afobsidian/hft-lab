name: Clang checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        preset: [debug, sanitize, release]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev cmake ninja-build make
      - run: make test PRESET=${{ matrix.preset }}
